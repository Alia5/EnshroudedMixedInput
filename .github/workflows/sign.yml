name: Sign

on:
    workflow_call:
        inputs:
            artifact_suffix:
                required: false
                type: string
                default: ""
                description: "Suffix of the artifact names"
        secrets:
            SIGNSERVER_TOKEN:
                required: true

jobs:
    sign:
        name: Sign (${{ matrix.target.artifact }})
        runs-on: ubuntu-latest
        environment: ReleaseEnv
        strategy:
            matrix:
                target:
                    - {
                          artifact: EnshroudedMixedInput-windows_x64,
                          archive: "EnshroudedMixedInput-windows_x64${{ inputs.artifact_suffix }}.zip",
                      }
        defaults:
            run:
                working-directory: artifact
        env:
            SIGNSERVER: https://signproxy.1-3-3-7.dev/api/v1/sign
            BINARIES: EnshroudedMixedInput.dll dinput8.dll
            ARCHIVE: ${{ matrix.target.archive }}
        steps:
            - name: Download artifact
              uses: actions/download-artifact@v8.0.1
              with:
                  name: ${{ matrix.target.artifact }}${{ inputs.artifact_suffix }}
                  path: artifact

            - name: Extract binaries from archive
              run: unzip "$ARCHIVE" $BINARIES

            - name: Sign Windows PEs
              env:
                  SIGNSERVER_TOKEN: ${{ secrets.SIGNSERVER_TOKEN }}
              run: |
                  FILES=()
                  for binary in $BINARIES; do FILES+=(-F "files=@$binary"); done
                  curl --fail -H "Authorization: Bearer $SIGNSERVER_TOKEN" "${FILES[@]}" -o signed.zip "$SIGNSERVER/binary"
                  unzip -o signed.zip $BINARIES
                  rm signed.zip

            - name: Move signed binaries into archive
              run: zip --move "$ARCHIVE" $BINARIES

            - name: Add SHA256SUMS to archive
              run: |
                  mkdir contents
                  unzip -q "$ARCHIVE" -d contents
                  (cd contents && sha256sum * > ../SHA256SUMS)
                  rm -rf contents
                  zip --move "$ARCHIVE" SHA256SUMS

            - name: Upload signed artifact
              uses: actions/upload-artifact@v7.0.1
              with:
                  name: ${{ matrix.target.artifact }}${{ inputs.artifact_suffix }}
                  path: artifact
                  overwrite: true
                  if-no-files-found: error
