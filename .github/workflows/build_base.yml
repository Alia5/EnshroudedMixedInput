name: EnshroudedMixedInput Build Base

on:
    workflow_call:
        inputs:
            artifact_suffix:
                required: false
                type: string
                default: ""
                description: "Suffix to add to artifact names"
            upload_artifacts:
                required: false
                type: boolean
                default: false
                description: "Whether to upload build artifacts"

jobs:
    build:
        name: Build binaries (windows_x64)
        runs-on: windows-latest

        steps:
            - name: Disable git autocrlf
              run: |
                  git config --global core.autocrlf false
                  git config --global core.eol lf

            - name: Checkout
              uses: actions/checkout@v6.0.2
              with:
                  fetch-depth: 0

            - name: Setup Go
              uses: actions/setup-go@v6.4.0
              with:
                  go-version-file: go.mod
                  cache: true
                  cache-dependency-path: go.sum

            - name: Install build tools
              shell: pwsh
              run: |
                  function Install-Tool($id) {
                      winget install -e --id $id --accept-package-agreements --accept-source-agreements --disable-interactivity
                      if ($LASTEXITCODE -eq 0 -or $LASTEXITCODE -eq -1978335189 -or $LASTEXITCODE -eq -1978335212) {
                          $global:LASTEXITCODE = 0
                      } else {
                          throw "winget install $id failed with exit code $LASTEXITCODE"
                      }
                  }
                  Install-Tool MartinStorsjo.LLVM-MinGW.UCRT
                  Install-Tool Kitware.CMake

            - name: Setup just
              uses: extractions/setup-just@v3

            - name: Install goversioninfo
              run: |
                  go install github.com/josephspurrier/goversioninfo/cmd/goversioninfo@v1.7.0

            - name: Version
              id: version
              shell: bash
              run: |
                  VERSION=$(git describe --tags --always)
                  echo "version=$VERSION" >> $GITHUB_OUTPUT

            - name: Lint
              uses: golangci/golangci-lint-action@v9.2.0
              env:
                  CGO_ENABLED: "1"
              with:
                  version: latest
                  install-mode: goinstall

            - name: Build
              shell: bash
              env:
                  VERSION: ${{ steps.version.outputs.version }}
              run: |
                  just build Release

            - name: Licenses
              shell: bash
              env:
                  VERSION: ${{ steps.version.outputs.version }}
              run: |
                  just licenses
                  cp LICENSE.txt dist/

            - name: Run tests
              run: just test

            - name: Create archive
              shell: bash
              run: |
                  cd dist
                  7z a -tzip "EnshroudedMixedInput-windows_x64${{ inputs.artifact_suffix }}.zip" *

            - name: Upload artifact
              if: ${{ inputs.upload_artifacts }}
              uses: actions/upload-artifact@v7.0.1
              with:
                  name: EnshroudedMixedInput-windows_x64${{ inputs.artifact_suffix }}
                  path: dist/*.zip
                  if-no-files-found: error
